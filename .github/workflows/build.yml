name: build-exe
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --onefile --name HJ_Remote --add-data "remote.html;." --collect-submodules winrt --hidden-import win32com.client --hidden-import pythoncom remote_server.py
      - uses: actions/upload-artifact@v4
        with:
          name: HJ_Remote
          path: |
            dist/HJ_Remote.exe
            firewall_allow.bat
            HOWTO.txt
